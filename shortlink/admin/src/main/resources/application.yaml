server:
  port: 8001

spring:
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: ${spring.datasource.url}

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: delFlag

feign:
  okhttp:
    enabled: true
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

springdoc:
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'admin-service'
      paths-to-match: '/**'
      packages-to-scan: org.hang.shortlink.admin
